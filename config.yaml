# 1sat-stack configuration

# Network: "main" or "test"
network: main

# Logging configuration
logging:
  # Default log level for all components (debug, info, warn, error)
  level: info

# JungleBus client configuration
junglebus:
  url: https://junglebus.gorillapool.io
  # token: ""       # Optional API token
  # ssl: true       # Use SSL (default: true)
  # version: v1     # API version (default: v1)
  # debug: false    # Enable debug logging

# HTTP Server settings
server:
  port: 8080
  host: 0.0.0.0
  base_path: /1sat
  body_limit: 100mb  # Max request body size (supports: b, kb, mb, gb)
  pprof:
    enabled: true        # Enable pprof profiling server
    port: 6060           # Pprof server port
    host: localhost      # Pprof server host (localhost for security)

# TXO storage - BadgerDB (default)
store:
  mode: embedded
  provider: badger
  badger:
    path: ~/.1sat/store
    log_level: error  # Quiet BadgerDB internal logs (debug, info, warn, error)
    # in_memory: false

# PubSub for events
pubsub:
  mode: embedded
  provider: channels  # channels (in-memory), or redis for distributed
  channels:
    buffer_size: 100
  routes:
    enabled: true

# BEEF storage chain: LRU cache -> Redis -> Badger (migration) -> JungleBus fallback
beef:
  mode: embedded
  chain:
    - provider: lru
      lru:
        size: 100mb
    - provider: redis
      redis:
        url: redis://localhost:6380/1
        ttl: 8760h  # 1 year - marks keys as volatile for LRU eviction
    - provider: junglebus
  routes:
    enabled: true

# TXO indexed output storage
txo:
  mode: embedded
  routes:
    enabled: true

# Indexer service
indexer:
  mode: embedded
  verbose: false
  tags:
    - 1sat
    - p2pkh
    - lock
    - inscription
    - bsv21
    - ordlock
    - cosign
  sync:
    enabled: true
    queue_name: "ingest"    # Queue to consume from (q:ingest)
    concurrency: 24          # Worker concurrency
    page_size: 100          # Batch fetch size
    poll_delay: 1s          # Sleep when queue empty
  arcade:
    enabled: true           # Enable arcade event listener (bridges to pubsub)
    ingest: true            # Ingest transactions on ACCEPTED status
  log_level: info
  routes:
    enabled: true

# P2P client configuration
p2p:
  mode: embedded
  storage_path: ~/.1sat

# Chaintracks configuration
chaintracks:
  mode: embedded
  storage_path: ~/.1sat/chaintracks
  bootstrap_url: https://mainnet.gorillanode.io/api/v1

# Arcade configuration (transaction broadcasting)
arcade:
  mode: embedded
  storage_path: ~/.1sat/arcade
  log_level: debug
  database:
    type: sqlite
    sqlite_path: ~/.1sat/arcade/arcade.db
  events:
    type: memory
    buffer_size: 1000
  teranode:
    broadcast_urls:
      - https://teranode-eks-mainnet-eu-1-propagation.bsvb.tech
      # - http://mainnet.gorillanode.io:8833
      # - https://teranode-eks-testnet-eu-1-propagation.bsvb.tech/
    datahub_urls:
      - https://teranode-eks-mainnet-eu-1.bsvb.tech/api/v1
      # - https://mainnet.gorillanode.io/api/v1
      # - https://teranode-eks-testnet-eu-1.bsvb.tech/api/v1

# Merkle service (deprecated - now handled by indexer status handler)
# merkle:
#   mode: embedded
#   routes:
#     enabled: true

# BSV21 token support (optional)
bsv21:
  mode: embedded
  sync:
    enabled: true
    dispatch_workers: 16
    token_workers: 32
    fee_per_output: 1000
    lifecycle_interval: 5m  # How often to check token balances and manage workers (default: 5m)
    log_level: info  # Highlight BSV21 sync1 (debug, info, warn, error)
  routes:
    enabled: true

# Overlay services
overlay:
  mode: embedded
  topic_whitelist:
    - tm_bsv21
  # topic_blacklist: []  # Topics to disable even if whitelisted
  routes:
    enabled: true

# Owner sync services
owner:
  mode: embedded
  log_level: info  # Per-module log level (debug, info, warn, error)
  routes:
    enabled: true

# Wallet service (remote wallet storage via BRC-100)
wallet:
  mode: disabled  # disabled, embedded
  server_private_key: ""  # Required: hex-encoded private key for BRC-100 auth
  # name: "1sat-wallet"  # Storage name identifier
  db:
    engine: sqlite
    sqlite:
      connection_string: ~/.1sat/wallet.sqlite
  routes:
    enabled: true
    prefix: /wallet

# ORDFS content serving (optional)
ordfs:
  enabled: true
  redis:
    url: redis://localhost:6380/0
  routes:
    enabled: true

# Admin API
admin:
  routes:
    bearer_token: ""  # Set via ONESAT_ADMIN_ROUTES_BEARER_TOKEN env var

# JungleBus Sync subscriptions
jbsync:
  subscribers:
    - subscription_id: "51ce778bfa6c7c5fd3f3b6fbaf96ebde1348198c33ca26cb1a8fadbfee0212d7"
      queue_name: "bsv21"
      from_block: 783968  # BSV21 genesis block
      batch_size: 1000
      reorg_depth: 6
      enable_mempool: false
      autostart: true
    - subscription_id: "9efa781363dcdd470fdd2664c9ad75ff2195694429c88d638e6dd9631e78fa17"
      queue_name: "ingest"
      from_block: 783968
      batch_size: 500
      reorg_depth: 6
      enable_mempool: false
      autostart: true