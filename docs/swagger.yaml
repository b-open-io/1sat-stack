basePath: /1sat
definitions:
  admin.ProgressItem:
    properties:
      block:
        type: integer
      id:
        type: string
    type: object
  admin.TopicRequest:
    properties:
      topic:
        example: bsv21_token_id_here
        type: string
    type: object
  admin.UpdateProgressRequest:
    properties:
      block:
        example: 123456
        type: integer
    type: object
  arcade.FeeAmount:
    properties:
      bytes:
        type: integer
      satoshis:
        type: integer
    type: object
  arcade.PolicyResponse:
    properties:
      maxscriptsizepolicy:
        type: integer
      maxtxsigopscountspolicy:
        type: integer
      maxtxsizepolicy:
        type: integer
      miningFee:
        $ref: '#/definitions/arcade.FeeAmount'
    type: object
  arcade.TransactionRequest:
    properties:
      rawTx:
        example: 0100000001...
        type: string
    type: object
  chaintracks.ErrorResponse:
    properties:
      error:
        example: Header not found
        type: string
    type: object
  chaintracks.HeightResponse:
    properties:
      height:
        example: 874123
        type: integer
    type: object
  chaintracks.NetworkResponse:
    properties:
      network:
        example: mainnet
        type: string
    type: object
  github_com_b-open-io_1sat-stack_pkg_bsv21.TokenStatus:
    properties:
      credits:
        description: Funding metrics (from DB on creation/recalc)
        type: integer
      debits:
        type: integer
      fee_address:
        type: string
      fee_per_output:
        type: integer
      is_blacklisted:
        type: boolean
      is_whitelisted:
        description: List status
        type: boolean
      output_count:
        type: integer
      token_id:
        description: Identity
        type: string
    type: object
  github_com_b-open-io_1sat-stack_pkg_bsv21.WorkerStatus:
    properties:
      fee_address:
        type: string
      queue_depth:
        type: integer
      started_at:
        type: string
      status:
        $ref: '#/definitions/github_com_b-open-io_1sat-stack_pkg_bsv21.TokenStatus'
      token_id:
        type: string
    type: object
  github_com_b-open-io_1sat-stack_pkg_overlay.RemoteConfig:
    properties:
      broadcast:
        description: Outbound (sending data to peer)
        type: boolean
      gasp_sync:
        description: periodic full GASP sync
        type: boolean
      gasp_sync_interval:
        description: '"15m", "1h", etc.'
        type: string
      peer_id:
        description: for libp2p peers
        type: string
      sse_subscribe:
        description: Inbound (receiving data from peer)
        type: boolean
      type:
        description: Identity
        type: string
      url:
        description: for http peers
        type: string
    type: object
  github_com_b-open-io_1sat-stack_pkg_parse.BSV21:
    properties:
      amt:
        example: "0"
        type: string
      dec:
        example: "0"
        type: string
      icon:
        type: string
      id:
        type: string
      op:
        type: string
      sym:
        type: string
    type: object
  github_com_b-open-io_1sat-stack_pkg_txo.IndexedOutput:
    type: object
  github_com_b-open-io_1sat-stack_pkg_txo.IndexedOutputResponse:
    description: Transaction output with indexing metadata
    properties:
      blockHeight:
        description: Present if IncludeBlock
        type: integer
      blockIdx:
        description: Present if IncludeBlock
        type: integer
      data:
        additionalProperties: {}
        description: Present if IncludeTags has entries
        type: object
      events:
        description: Present if IncludeEvents
        items:
          type: string
        type: array
      outpoint:
        description: 'Always present: "txid.vout" format'
        type: string
      satoshis:
        description: Present if IncludeSats
        type: integer
      score:
        description: Always present
        type: number
      spend:
        description: Present if IncludeSpend (nil = unspent, string = spend txid)
        type: string
    type: object
  models.Status:
    enum:
    - UNKNOWN
    - RECEIVED
    - SENT_TO_NETWORK
    - ACCEPTED_BY_NETWORK
    - SEEN_ON_NETWORK
    - DOUBLE_SPEND_ATTEMPTED
    - REJECTED
    - MINED
    - IMMUTABLE
    type: string
    x-enum-varnames:
    - StatusUnknown
    - StatusReceived
    - StatusSentToNetwork
    - StatusAcceptedByNetwork
    - StatusSeenOnNetwork
    - StatusDoubleSpendAttempted
    - StatusRejected
    - StatusMined
    - StatusImmutable
  models.TransactionStatus:
    properties:
      blockHash:
        type: string
      blockHeight:
        type: integer
      competingTxs:
        items:
          type: string
        type: array
      extraInfo:
        type: string
      merklePath:
        items:
          type: integer
        type: array
      status:
        type: integer
      timestamp:
        type: string
      txStatus:
        $ref: '#/definitions/models.Status'
      txid:
        type: string
    type: object
  pkg_bap.Address:
    properties:
      address:
        type: string
      block:
        type: integer
      txId:
        type: string
    type: object
  pkg_bap.Identity:
    properties:
      _:
        type: string
      addresses:
        items:
          $ref: '#/definitions/pkg_bap.Address'
        type: array
      currentAddress:
        type: string
      firstSeen:
        type: integer
      idKey:
        type: string
      identity:
        additionalProperties: {}
        type: object
      rootAddress:
        type: string
    type: object
  pkg_bap.Profile:
    properties:
      _id:
        type: string
      data:
        items:
          type: integer
        type: array
    type: object
  pkg_bsv21.BalanceResponse:
    properties:
      balance:
        type: integer
      utxoCount:
        type: integer
    type: object
  pkg_bsv21.BlockInfo:
    properties:
      hash:
        type: string
      height:
        type: integer
      previousblockhash:
        type: string
      timestamp:
        type: integer
    type: object
  pkg_bsv21.BlockResponse:
    properties:
      block:
        $ref: '#/definitions/pkg_bsv21.BlockInfo'
      transactions:
        items:
          $ref: '#/definitions/pkg_bsv21.TransactionData'
        type: array
    type: object
  pkg_bsv21.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  pkg_bsv21.OutputData:
    description: Output or input data for a transaction
    properties:
      data:
        additionalProperties: {}
        type: object
      spend:
        description: Spending txid hex (for outputs only, null if unspent)
        type: string
      txid:
        description: Source txid (for inputs only)
        type: string
      vout:
        type: integer
    type: object
  pkg_bsv21.TokenDetailResponse:
    description: Combined token metadata and funding status
    properties:
      status:
        $ref: '#/definitions/pkg_bsv21.TokenStatus'
      token:
        $ref: '#/definitions/github_com_b-open-io_1sat-stack_pkg_parse.BSV21'
      tokenId:
        type: string
    type: object
  pkg_bsv21.TokenStatus:
    properties:
      credits:
        description: Funding metrics (from DB on creation/recalc)
        type: integer
      debits:
        type: integer
      fee_address:
        type: string
      fee_per_output:
        type: integer
      is_blacklisted:
        type: boolean
      is_whitelisted:
        description: List status
        type: boolean
      output_count:
        type: integer
      token_id:
        description: Identity
        type: string
    type: object
  pkg_bsv21.TransactionData:
    description: Transaction details with inputs, outputs, and optional BEEF
    properties:
      beef:
        items:
          type: integer
        type: array
      block_height:
        type: integer
      inputs:
        items:
          $ref: '#/definitions/pkg_bsv21.OutputData'
        type: array
      outputs:
        items:
          $ref: '#/definitions/pkg_bsv21.OutputData'
        type: array
      txid:
        type: string
    type: object
  pkg_chaintracks.BlockHeader:
    properties:
      bits:
        description: 4 bytes - Difficulty target
        type: integer
      hash:
        items:
          type: integer
        type: array
      height:
        description: Block height in the chain
        type: integer
      merkleRoot:
        description: 32 bytes - Merkle root hash
        items:
          type: integer
        type: array
      nonce:
        description: 4 bytes - Nonce
        type: integer
      previousHash:
        description: 32 bytes - Previous block hash
        items:
          type: integer
        type: array
      time:
        description: 4 bytes - Block timestamp (Unix time)
        type: integer
      version:
        description: 4 bytes - Block version
        type: integer
    type: object
  pkg_indexer.ArcEvent:
    properties:
      extraInfo:
        type: string
      merklePath:
        items:
          type: integer
        type: array
      rawTx:
        description: Hex-encoded raw tx (non-EF format)
        type: string
      txId:
        type: string
      txStatus:
        type: string
    type: object
  pkg_opns.MineResult:
    properties:
      domain:
        type: string
      outpoint:
        $ref: '#/definitions/transaction.Outpoint'
    type: object
  pkg_ordfs.Response:
    properties:
      content:
        items:
          type: integer
        type: array
      contentLength:
        type: integer
      contentType:
        type: string
      map:
        items:
          type: integer
        type: array
      origin:
        $ref: '#/definitions/transaction.Outpoint'
      outpoint:
        $ref: '#/definitions/transaction.Outpoint'
      parent:
        $ref: '#/definitions/transaction.Outpoint'
      sequence:
        type: integer
    type: object
  pkg_owner.BalanceResponse:
    properties:
      balance:
        type: integer
      count:
        type: integer
    type: object
  pkg_paymail.p2pMetadata:
    properties:
      note:
        type: string
      sender:
        type: string
    type: object
  pkg_paymail.paymentDestinationRequest:
    properties:
      satoshis:
        type: integer
    type: object
  pkg_paymail.receiveBeefRequest:
    properties:
      beef:
        type: string
      metadata:
        $ref: '#/definitions/pkg_paymail.p2pMetadata'
      reference:
        type: string
    type: object
  pkg_paymail.receiveTransactionRequest:
    properties:
      hex:
        type: string
      metadata:
        $ref: '#/definitions/pkg_paymail.p2pMetadata'
      reference:
        type: string
    type: object
  pkg_txo.IndexedOutputResponse:
    description: Transaction output with indexing metadata
    properties:
      blockHeight:
        description: Present if IncludeBlock
        type: integer
      blockIdx:
        description: Present if IncludeBlock
        type: integer
      data:
        additionalProperties: {}
        description: Present if IncludeTags has entries
        type: object
      events:
        description: Present if IncludeEvents
        items:
          type: string
        type: array
      outpoint:
        description: 'Always present: "txid.vout" format'
        type: string
      satoshis:
        description: Present if IncludeSats
        type: integer
      score:
        description: Always present
        type: number
      spend:
        description: Present if IncludeSpend (nil = unspent, string = spend txid)
        type: string
    type: object
  pkg_txo.SpendResponse:
    properties:
      spendTxid:
        type: string
    type: object
  transaction.Outpoint:
    properties:
      index:
        type: integer
      txid:
        items:
          type: integer
        type: array
    type: object
info:
  contact:
    name: API Support
    url: https://github.com/b-open-io/1sat-stack
  description: Composable BSV blockchain services API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: 1Sat Stack API
  version: "1.0"
paths:
  /.well-known/bsvalias:
    get:
      description: Returns the .well-known/bsvalias capability document listing supported
        paymail features
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              bsvalias:
                type: string
              capabilities:
                type: object
            type: object
      summary: BSV alias capability discovery
      tags:
      - paymail
  /admin/blacklist:
    get:
      description: Returns the list of blacklisted topics
      produces:
      - application/json
      responses:
        "200":
          description: List of blacklisted topics
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get blacklist
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Adds a topic to the blacklist
      parameters:
      - description: Topic to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.TopicRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add to blacklist
      tags:
      - admin
  /admin/blacklist/{topic}:
    delete:
      description: Removes a topic from the blacklist
      parameters:
      - description: Topic ID to remove
        in: path
        name: topic
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove from blacklist
      tags:
      - admin
  /admin/bsv21/workers:
    get:
      description: Returns the status of all active BSV21 token workers
      produces:
      - application/json
      responses:
        "200":
          description: List of active workers
          schema:
            items:
              $ref: '#/definitions/github_com_b-open-io_1sat-stack_pkg_bsv21.WorkerStatus'
            type: array
      security:
      - BearerAuth: []
      summary: Get BSV21 workers
      tags:
      - admin
  /admin/lookups/active:
    get:
      description: Returns the list of currently active lookup services from the overlay
        engine
      produces:
      - application/json
      responses:
        "200":
          description: List of active lookup services
          schema:
            items:
              type: string
            type: array
      security:
      - BearerAuth: []
      summary: Get active lookup services
      tags:
      - admin
  /admin/progress:
    get:
      description: Returns all sync progress entries (subscriptions, owners, peers)
      produces:
      - application/json
      responses:
        "200":
          description: List of progress entries
          schema:
            items:
              $ref: '#/definitions/admin.ProgressItem'
            type: array
      security:
      - BearerAuth: []
      summary: Get progress
      tags:
      - admin
  /admin/progress/{id}:
    delete:
      description: Deletes a sync progress entry
      parameters:
      - description: Progress ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete progress
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Updates a sync progress entry
      parameters:
      - description: Progress ID
        in: path
        name: id
        required: true
        type: string
      - description: Block height
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateProgressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update progress
      tags:
      - admin
  /admin/setup:
    post:
      description: Adds the authenticated identity as the first admin
      produces:
      - application/json
      responses:
        "200":
          description: success message
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Already configured
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Perform admin setup
      tags:
      - admin
  /admin/status:
    get:
      description: Returns whether any admin identities have been configured
      produces:
      - application/json
      responses:
        "200":
          description: configured status
          schema:
            additionalProperties:
              type: boolean
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get setup status
      tags:
      - admin
  /admin/topics/{name}/remotes:
    delete:
      description: Removes the remote config override, reverting to defaults
      parameters:
      - description: Topic name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete topic remotes
      tags:
      - admin
    get:
      description: Returns the configured remotes for a topic
      parameters:
      - description: Topic name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of configured remotes
          schema:
            items:
              $ref: '#/definitions/github_com_b-open-io_1sat-stack_pkg_overlay.RemoteConfig'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get topic remotes
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Sets the configured remotes for a topic (overrides defaults)
      parameters:
      - description: Topic name
        in: path
        name: name
        required: true
        type: string
      - description: Remote configurations
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/github_com_b-open-io_1sat-stack_pkg_overlay.RemoteConfig'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: success message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set topic remotes
      tags:
      - admin
  /admin/topics/active:
    get:
      description: Returns the list of currently active topics from the overlay engine
      produces:
      - application/json
      responses:
        "200":
          description: List of active topics
          schema:
            items:
              type: string
            type: array
      security:
      - BearerAuth: []
      summary: Get active topics
      tags:
      - admin
  /admin/whitelist:
    get:
      description: Returns the list of whitelisted BSV21 tokens (always active)
      produces:
      - application/json
      responses:
        "200":
          description: List of whitelisted tokens
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get whitelist
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Adds a BSV21 token to the whitelist (always active)
      parameters:
      - description: Token to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.TopicRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add to whitelist
      tags:
      - admin
  /admin/whitelist/{token}:
    delete:
      description: Removes a BSV21 token from the whitelist
      parameters:
      - description: Token ID to remove
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success message
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove from whitelist
      tags:
      - admin
  /arc/callback:
    post:
      consumes:
      - application/json
      description: Receives transaction status updates from Arc/Arcade broadcaster
        via webhook
      parameters:
      - description: Arc callback payload
        in: body
        name: callback
        required: true
        schema:
          $ref: '#/definitions/pkg_indexer.ArcEvent'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Handle Arc callback
      tags:
      - arc
  /arcade/events/{callbackToken}:
    get:
      description: Server-Sent Events stream of transaction status updates for transactions
        associated with the callback token
      parameters:
      - description: Callback token from transaction submission
        in: path
        name: callbackToken
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream of transaction status updates
          schema:
            type: string
      summary: Stream transaction events
      tags:
      - arcade
  /arcade/policy:
    get:
      description: Returns the transaction policy configuration including fee rates
        and limits
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/arcade.PolicyResponse'
      summary: Get policy
      tags:
      - arcade
  /arcade/tx:
    post:
      consumes:
      - application/json
      - application/octet-stream
      - text/plain
      description: Submit a single transaction for broadcast. Accepts raw transaction
        bytes, hex string, or JSON with rawTx field.
      parameters:
      - description: Transaction data
        in: body
        name: transaction
        required: true
        schema:
          $ref: '#/definitions/arcade.TransactionRequest'
      - description: URL for status callbacks
        in: header
        name: X-CallbackUrl
        type: string
      - description: Token for SSE event filtering
        in: header
        name: X-CallbackToken
        type: string
      - description: Send all status updates (true/false)
        in: header
        name: X-FullStatusUpdates
        type: string
      - description: Skip fee validation (true/false)
        in: header
        name: X-SkipFeeValidation
        type: string
