  /owner/{owner}/balance:
    get:
      description: Get the satoshi balance for a specific owner
      parameters:
      - description: Owner identifier (address, pubkey, or script hash)
        in: path
        name: owner
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg_owner.BalanceResponse'
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get owner balance
      tags:
      - owner
  /owner/{owner}/txos:
    get:
      description: Stream transaction outputs owned by a specific owner via Server-Sent
        Events. When refresh is enabled, sync progress is streamed first, followed
        by results. On reconnect, the browser sends Last-Event-ID which skips refresh
        and resumes from that score.
      parameters:
      - description: Owner identifier (address, pubkey, or script hash)
        in: path
        name: owner
        required: true
        type: string
      - description: Score of last received event (sent automatically by EventSource
          on reconnect). When present, refresh is skipped.
        in: header
        name: Last-Event-ID
        type: string
      - default: true
        description: Refresh owner data from blockchain before returning
        in: query
        name: refresh
        type: boolean
      - default: true
        description: Filter for unspent outputs only
        in: query
        name: unspent
        type: boolean
      - description: Comma-separated list of tags to include (* for all)
        in: query
        name: tags
        type: string
      - default: true
        description: Include satoshi values
        in: query
        name: sats
        type: boolean
      - default: true
        description: Include spend txid
        in: query
        name: spend
        type: boolean
      - default: true
        description: Include events array
        in: query
        name: events
        type: boolean
      - default: true
        description: Include block height and index
        in: query
        name: block
        type: boolean
      - description: Starting score for pagination
        in: query
        name: from
        type: number
      - description: Reverse order
        in: query
        name: rev
        type: boolean
      - default: 100
        description: Maximum number of results
        in: query
        name: limit
        type: integer
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream of sync progress and TXO events
          schema:
            type: string
        "400":
          description: Bad request
          schema:
            type: string
      summary: Stream owner TXOs via SSE
      tags:
      - owner
  /owner/sync:
    get:
      description: Stream paginated outputs for wallet synchronization via Server-Sent
        Events. Streams all outputs until exhausted, then triggers background sync
        and sends retry directive.
      parameters:
      - collectionFormat: csv
        description: Owner identifier(s) (address, pubkey, or script hash)
        in: query
        items:
          type: string
        name: owner
        required: true
        type: array
      - description: Starting score for pagination
        in: query
        name: from
        type: number
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream of SyncOutput events
          schema:
            type: string
      summary: Stream owner sync via SSE
      tags:
      - owner
  /sse/{topics}:
    get:
      description: Establishes an SSE connection for real-time event streaming
      parameters:
      - description: Comma-separated list of topics to subscribe to
        in: path
        name: topics
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
      summary: Subscribe to Server-Sent Events
      tags:
      - sse
