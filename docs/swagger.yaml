  /txo/search:
    get:
      description: 'Search transaction outputs by indexed keys. Keys use type prefixes:
        "ev:" for events, "tp:" for topics. Without prefix, "ev:" is assumed.'
      parameters:
      - collectionFormat: csv
        description: Search key(s) (e.g., ev:own:address, tp:tm_bsv21, own:address)
        in: query
        items:
          type: string
        name: key
        required: true
        type: array
      - description: 'Join type for multiple keys: union (default), intersect, difference'
        in: query
        name: join
        type: string
      - description: Starting score for pagination
        in: query
        name: from
        type: number
      - description: Reverse order
        in: query
        name: rev
        type: boolean
      - default: 100
        description: Maximum number of results
        in: query
        name: limit
        type: integer
      - description: Filter for unspent outputs only
        in: query
        name: unspent
        type: boolean
      - description: Include satoshis
        in: query
        name: sats
        type: boolean
      - description: Include spend txid
        in: query
        name: spend
        type: boolean
      - description: Include events array
        in: query
        name: events
        type: boolean
      - description: Include blockHeight and blockIdx
        in: query
        name: block
        type: boolean
      - description: Comma-separated list of data tags to include
        in: query
        name: tags
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/pkg_txo.IndexedOutputResponse'
            type: array
        "400":
          description: At least one key is required
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Search outputs by key(s)
      tags:
      - txos
  /txo/spends:
    post:
      consumes:
