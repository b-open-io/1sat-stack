<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collections</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --card: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --faint: #484f58;
        --line: #21262d;
        --link: #58a6ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 ui-sans-serif, system-ui, sans-serif;
      }
      a { color: var(--link); text-decoration: none; }
      a:hover { text-decoration: underline; }
      main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 48px; }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }
      h1 { font-size: 20px; margin: 0; font-weight: 650; }
      h1 a { color: inherit; }
      .status { color: var(--muted); font-size: 14px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
      .card {
        display: block;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        color: inherit;
      }
      .card:hover { text-decoration: none; border-color: #30363d; }
      .thumb {
        aspect-ratio: 1;
        background: var(--line);
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .thumb img.failed { display: none; }
      .meta { padding: 8px 10px 10px; }
      .name {
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .live { color: #3fb950; }
      .detail {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 20px;
        margin-bottom: 28px;
      }
      .hero {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        background: var(--line);
        border-radius: 8px;
        display: block;
      }
      .hero.failed { display: none; }
      .desc { color: var(--text); white-space: pre-wrap; margin: 8px 0 12px; }
      .facts { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 16px; }
      .facts code { color: var(--text); font-size: 12px; }
      h2 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
      @media (max-width: 640px) {
        .detail { grid-template-columns: 1fr; }
        .hero { max-width: 280px; }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      const PAGE = 100

      function prefix() {
        const path = location.pathname
        const i = path.indexOf("/collections")
        return i >= 0 ? path.slice(0, i) : ""
      }

      function uiBase() {
        return prefix() + "/collections/"
      }

      function collectionId() {
        const path = location.pathname.replace(/\/+$/, "")
        const marker = "/collections/"
        const i = path.indexOf(marker)
        if (i < 0) return ""
        return decodeURIComponent(path.slice(i + marker.length))
      }

      function contentUrl(outpoint) {
        return "/content/" + encodeURIComponent(outpoint)
      }

      async function getJSON(url) {
        const res = await fetch(url)
        const body = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(body.error || res.statusText || "request failed")
        return body
      }

      function subtype(entry) {
        const raw = entry && entry.map && entry.map.subTypeData
        if (!raw) return {}
        if (typeof raw === "object") return raw
        try { return JSON.parse(raw) } catch { return {} }
      }

      function title(entry) {
        return (entry && entry.name) || "untitled"
      }

      function when(score) {
        if (!score) return ""
        if (score > 1e9) return "unconfirmed"
        return "block " + Math.floor(score).toLocaleString()
      }

      function short(s) {
        if (!s) return ""
        return s.length > 16 ? s.slice(0, 8) + "…" + s.slice(-6) : s
      }

      function el(tag, attrs, children) {
        const node = document.createElement(tag)
        if (attrs) {
          for (const [k, v] of Object.entries(attrs)) {
            if (k === "class") node.className = v
            else if (k === "text") node.textContent = v
            else if (v != null) node.setAttribute(k, v)
          }
        }
        for (const child of children || []) {
          if (child) node.append(child)
        }
        return node
      }

      function thumb(outpoint, className) {
        const box = el("div", { class: "thumb" })
        const img = el("img", { alt: "", src: contentUrl(outpoint), class: className || "" })
        img.addEventListener("error", () => img.classList.add("failed"))
        box.append(img)
        return box
      }

      function card(entry, href, indexing) {
        const sub = []
        if (entry.mintNumber != null) sub.push("#" + entry.mintNumber)
        else if (entry.signer) sub.push(short(entry.signer))
        const link = el("a", { class: "card", href })
        const lines = [
          el("div", { class: "name", text: title(entry) }),
          sub.length ? el("div", { class: "sub", text: sub.join(" · ") }) : null,
        ]
        if (indexing) lines.push(el("div", { class: "sub live", text: "indexing" }))
        link.append(thumb(entry.outpoint), el("div", { class: "meta" }, lines))
        return link
      }

      function grid(entries, hrefFor, indexing) {
        const g = el("div", { class: "grid" })
        for (const entry of entries) {
          const id = entry.collectionId || entry.outpoint
          g.append(card(entry, hrefFor(entry), indexing && indexing.has(id)))
        }
        return g
      }

      function statusLine(status) {
        if (!status) return ""
        const bits = []
        if (status.is_whitelisted) bits.push("whitelisted")
        else if (status.is_blacklisted) bits.push("blacklisted")
        else if (status.balance > 0) bits.push("funded")
        else bits.push("unfunded")
        bits.push(status.is_active ? "active" : "inactive")
        if (status.output_count != null) bits.push(status.output_count + " indexed")
        return bits.join(" · ")
      }

      function renderIndex(entries, activeIds) {
        const app = document.getElementById("app")
        app.replaceChildren(
          el("header", null, [
            el("h1", { text: "Collections" }),
            el("div", { class: "status", text: entries.length ? String(entries.length) : "" }),
          ]),
        )
        if (!entries.length) {
          app.append(el("p", { class: "status", text: "No collections indexed." }))
          return
        }
        app.append(grid(entries, (entry) => uiBase() + encodeURIComponent(entry.collectionId || entry.outpoint), activeIds))
      }

      function renderCollection(entry, items) {
        const data = subtype(entry)
        const facts = []
        if (data.quantity) facts.push(el("span", { text: Number(data.quantity).toLocaleString() + " supply" }))
        if (entry.signer) facts.push(el("span", null, [document.createTextNode("signer "), el("code", { text: short(entry.signer) })]))
        const height = when(entry.score)
        if (height) facts.push(el("span", { text: height }))
        const funding = statusLine(entry.status)
        if (funding) facts.push(el("span", { class: entry.status && entry.status.is_active ? "live" : "", text: funding }))

        const copy = el("div")
        copy.append(el("h1", { text: title(entry) }))
        if (data.description) copy.append(el("p", { class: "desc", text: String(data.description) }))
        if (facts.length) copy.append(el("div", { class: "facts" }, facts))

        const hero = el("img", { class: "hero", alt: "", src: contentUrl(entry.outpoint) })
        hero.addEventListener("error", () => hero.classList.add("failed"))

        const app = document.getElementById("app")
        app.replaceChildren(
          el("header", null, [
            el("h1", null, [el("a", { href: uiBase(), text: "Collections" })]),
          ]),
          el("section", { class: "detail" }, [hero, copy]),
          el("h2", { text: items.length ? "Items" : "Items" }),
        )
        if (!items.length) {
          const waiting = entry.status && entry.status.is_active
          app.append(el("p", { class: "status", text: waiting ? "Active. No items indexed yet." : "No items indexed." }))
          return
        }
        app.append(grid(items, (item) => contentUrl(item.outpoint)))
      }

      function renderError(message) {
        document.getElementById("app").replaceChildren(
          el("header", null, [el("h1", null, [el("a", { href: uiBase(), text: "Collections" })])]),
          el("p", { class: "status", text: message }),
        )
      }

      async function main() {
        const id = collectionId()
        const api = prefix() + "/collection"
        try {
          if (!id) {
            const [entries, statuses] = await Promise.all([
              getJSON(api + "/?limit=" + PAGE + "&rev=true"),
              getJSON(api + "/status").catch(() => []),
            ])
            const activeIds = new Set(
              (Array.isArray(statuses) ? statuses : [])
                .filter((s) => s.is_active)
                .map((s) => s.collection_id),
            )
            renderIndex(Array.isArray(entries) ? entries : [], activeIds)
            return
          }
          const [entry, items] = await Promise.all([
            getJSON(api + "/" + encodeURIComponent(id)),
            getJSON(api + "/" + encodeURIComponent(id) + "/items?limit=" + PAGE),
          ])
          renderCollection(entry, Array.isArray(items) ? items : [])
        } catch (err) {
          renderError(err.message || "failed to load")
        }
      }

      main()
    </script>
  </body>
</html>
