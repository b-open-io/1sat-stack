# Test configuration — uses ~/.1sat-test/ to avoid clobbering production data

network: main

logging:
  level: debug

server:
  port: 8080
  host: 0.0.0.0
  base_path: /1sat

store:
  badger:
    path: ~/.1sat-test/store
    log_level: error

beef:
  chain:
    - provider: lru
      lru:
        size: 100mb
    - provider: redis
      redis:
        url: redis://localhost:6379/1
        ttl: 8760h
    - provider: junglebus

p2p:
  storage_path: ~/.1sat-test

chaintracks:
  storage_path: ~/.1sat-test/chaintracks
  bootstrap_url: https://mainnet.gorillanode.io/api/v1

arcade:
  storage_path: ~/.1sat-test/arcade
  log_level: debug
  database:
    sqlite_path: ~/.1sat-test/arcade/arcade.db
  teranode:
    broadcast_urls:
      - http://mainnet.gorillanode.io:8833
    datahub_urls:
      - https://teranode-eks-mainnet-eu-1.bsvb.tech/api/v1

wallet:
  db:
    sqlite:
      connection_string: ~/.1sat-test/wallet.sqlite

ordfs:
  redis:
    url: redis://localhost:6379/0

auth:
  allow_unauthenticated: true
