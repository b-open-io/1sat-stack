# 1sat-stack configuration
#
# Most settings are managed through the admin UI after initial setup.
# This file is only for infrastructure overrides that can't go through the UI:
# ports, external service URLs, storage backends, and sensitive values.
#
# Sensitive values (private keys, tokens) should use environment variables
# with the ONESAT_ prefix: wallet.server_private_key -> ONESAT_WALLET_SERVER_PRIVATE_KEY

# Network: "main" or "test"
network: main

# Logging
logging:
  level: info

# HTTP Server
server:
  port: 8080
  host: 0.0.0.0
  base_path: /1sat
  # body_limit: 100mb
  # pprof:
  #   enabled: false
  #   port: 6060

# JungleBus (optional — needed for historical chain sync)
junglebus:
  url: https://junglebus.gorillapool.io

# Data store — default is Badger (embedded). Switch to Redis for distributed deployments.
# store:
#   provider: redis
#   redis:
#     url: redis://localhost:6379/0

# BEEF storage chain — default is LRU cache + JungleBus fallback.
# Add Redis or filesystem tiers for persistence:
# beef:
#   chain:
#     - provider: lru
#       lru:
#         size: 100mb
#     - provider: redis
#       redis:
#         url: redis://localhost:6379/1
#         ttl: 8760h
#     - provider: junglebus

# Chaintracks — block header tracking
chaintracks:
  bootstrap_url: https://mainnet.gorillanode.io/api/v1

# Arcade — transaction broadcasting
arcade:
  teranode:
    broadcast_urls:
      - https://teranode-eks-mainnet-eu-1-propagation.bsvb.tech
    datahub_urls:
      - https://teranode-eks-mainnet-eu-1.bsvb.tech/api/v1

# ORDFS Redis cache (optional — improves content serving performance)
# ordfs:
#   redis:
#     url: redis://localhost:6379/0

# MongoDB (required only if BSocial overlay is enabled)
# mongodb:
#   url: mongodb://mongo:mongo@localhost:27017

# Auth
# auth:
#   api_key: ""            # ONESAT_AUTH_API_KEY — static key for agent/dev access
#   session_ttl: 24h
